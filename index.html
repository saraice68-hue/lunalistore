<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐰💜 LUNALI STREAM 💜🐰</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#3b0764,#7e22ce,#d8b4fe);
    display:flex;
    justify-content:center;
    padding:20px;
}
.container{
    width:100%;
    max-width:520px;
    background:#f5e8ff;
    border-radius:25px;
    padding:25px 15px;
    box-shadow:0 15px 35px rgba(0,0,0,0.30);
    display:flex;
    flex-direction:column;
    align-items:center;
}
h1{
    background:linear-gradient(90deg,#4c1d95,#8b5cf6,#c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    font-size:1.9rem;
    font-weight:900;
    text-align:center;
    margin-bottom:15px;
}
.guia{
    width:90%;
    background:#ead5ff;
    padding:15px;
    border-radius:18px;
    margin-bottom:15px;
    color:#4c1d95;
    font-size:0.95rem;
}
input{
    display:block;
    width:90%;
    max-width:420px;
    margin:10px auto;
    padding:14px;
    border-radius:16px;
    border:2px solid #a855f7;
    font-size:1rem;
    box-sizing:border-box;
}
#perfilBtns,#adminBtns{
    width:90%;
    display:flex;
    justify-content:center;
    gap:10px;
    margin:15px 0;
    flex-wrap:wrap;
}
#perfilBtns button,#adminBtns button{
    padding:8px 16px;
    border:none;
    border-radius:20px;
    background:#ddd6fe;
    color:#4c1d95;
    font-weight:bold;
    cursor:pointer;
}
#perfilBtns button.active,#adminBtns button.active{
    background:#7e22ce;
    color:white;
}
#salida{
    width:90%;
    background:#ffffff;
    padding:15px;
    border-radius:18px;
    min-height:220px;
    white-space:pre-wrap;
    font-family:monospace;
    color:#4c1d95;
    border:2px dashed #a855f7;
}
#copiarBtn,#limpiarBtn{
    width:90%;
    margin-top:18px;
    padding:14px;
    background:#7e22ce;
    color:white;
    border:none;
    border-radius:30px;
    font-size:1rem;
    cursor:pointer;
}
#limpiarBtn{
    background:#a855f7;
    margin-top:10px;
}
.subtitulo{
    width:90%;
    color:#4c1d95;
    font-weight:bold;
    margin-top:10px;
    text-align:center;
}
</style>
</head>

<body>
<div class="container">

<h1>🐰💜 LUNALI STREAM 💜🐰</h1>

<div class="guia">
<b>Guía:</b><br>
n: Netflix<br>
m: Max<br>
p: Prime Video<br>
pr: Paramount+<br>
v: Vix<br>
va: Vix Anual<br>
d: Disney+<br>
c: Crunchyroll<br>
s: Spotify Individual<br>
s3: Spotify 3 meses Individual<br>
fx: Fox One<br><br>

En "Tipo", escribe <b>c</b> para COMPLETA.
</div>

<div class="subtitulo">Administrador en turno</div>
<div id="adminBtns"></div>

<input id="plataforma" placeholder="Plataforma / abreviatura">
<input id="correo" placeholder="Correo">
<input id="contrasena" placeholder="Contraseña">
<input id="tipo" placeholder="Tipo">

<div id="perfilBtns"></div>

<div id="salida"></div>

<button id="copiarBtn">📋 Copiar todo</button>
<button id="limpiarBtn">🧹 Limpiar formulario</button>

</div>
